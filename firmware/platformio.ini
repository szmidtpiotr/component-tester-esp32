; Component tester bridge - ESP32-C3 SuperMini (4 MB flash, native USB)
;   Build and flash over USB:  pio run -t upload
;   Later updates over Wi-Fi:  upload .pio/build/esp32c3/firmware.bin in the web UI (Settings)

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
extra_scripts = pre:tools_embed.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
